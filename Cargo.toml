[package]
name = "keep-me-out"
version = "0.1.0"
edition = "2021"
description = "Local DNS proxy that blocks whole domains on macOS"

[[bin]]
name = "keep-me-out"
path = "src/main.rs"

[dependencies]
idna = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.5"
url = "2"
